# MAC database Q&A website: serve http://<host>/macdb/ from the app on 127.0.0.1:8510
# Install as /etc/nginx/default.d/macdb.conf (loaded inside the default port-80 server).
location = /macdb { return 301 /macdb/; }
location /macdb/ {
    proxy_pass http://127.0.0.1:8510/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;        # answers stream live
    proxy_read_timeout 300s;
    client_max_body_size 64k;
}
